name: Build Relocatable Exe

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }} bundle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64
            julia_arch: x64
          - runner: macos-14
            target: macos-aarch64
            julia_arch: aarch64
          - runner: macos-15-intel
            target: macos-x86_64
            julia_arch: x64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
          arch: ${{ matrix.julia_arch }}

      - uses: julia-actions/cache@v3

      - name: Build relocatable bundle
        env:
          JULIAC_ENV: /tmp/juliac-env
          BUNDLE_DIR: build-juliac
          EXE_NAME: fitsexplore
          TRIM_MODE: safe
          EXPERIMENTAL: "1"
        run: julia --color=yes make.jl

      - name: Archive CLI bundle
        run: |
          set -euxo pipefail
          ARCHIVE="fitsexplore-${{ matrix.target }}.tar.gz"
          STAGE_DIR="/tmp/archive-${{ matrix.target }}"
          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}"
          cp -R "${GITHUB_WORKSPACE}/build-juliac" "${STAGE_DIR}/fitsexplore"
          tar -C "${STAGE_DIR}" -czf "/tmp/${ARCHIVE}" fitsexplore
          mv "/tmp/${ARCHIVE}" "${GITHUB_WORKSPACE}/${ARCHIVE}"

      - name: Archive macOS .app bundle
        if: startsWith(matrix.target, 'macos-')
        run: |
          set -euxo pipefail
          APP_ROOT="${GITHUB_WORKSPACE}/FITSexplore.app/Contents"
          APP_ARCHIVE="fitsexplore-${{ matrix.target }}.app.tar.gz"
          APP_VERSION=$(awk -F '"' '/^version = "/ { print $2; exit }' "${GITHUB_WORKSPACE}/Project.toml")
          APP_VERSION=${APP_VERSION:-0.0.0}

          rm -rf "${GITHUB_WORKSPACE}/FITSexplore.app"
          mkdir -p "${APP_ROOT}/MacOS" "${APP_ROOT}/Resources"

          cp -R "${GITHUB_WORKSPACE}/build-juliac/lib" "${APP_ROOT}/lib"
          cp -R "${GITHUB_WORKSPACE}/build-juliac/share" "${APP_ROOT}/share"
          cp "${GITHUB_WORKSPACE}/build-juliac/bin/fitsexplore" "${APP_ROOT}/MacOS/fitsexplore"
          chmod +x "${APP_ROOT}/MacOS/fitsexplore"

          cat > "${APP_ROOT}/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>FITSexplore</string>
            <key>CFBundleDisplayName</key>
            <string>FITSexplore</string>
            <key>CFBundleIdentifier</key>
            <string>org.ferreols.fitsexplore</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>fitsexplore</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
          </dict>
          </plist>
          EOF

          tar -C "${GITHUB_WORKSPACE}" -czf "${GITHUB_WORKSPACE}/${APP_ARCHIVE}" FITSexplore.app

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitsexplore-${{ matrix.target }}
          path: fitsexplore-${{ matrix.target }}*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish archives to exe branch
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download archive artifacts
        uses: actions/download-artifact@v5
        with:
          path: /tmp/exe-archives

      - name: Publish archives to exe branch
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Destroy remote exe branch before publishing a fresh orphan history.
          git push origin --delete exe || true

          git checkout --orphan exe
          git reset --hard

          # Keep branch contents focused on distributable artefacts.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp /tmp/exe-archives/*/*.tar.gz ./

          cat > README.txt <<EOF
          Relocatable FITSexplore executable bundles.

          Source commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          printf '\nAvailable archives:\n' >> README.txt
          ls -1 *.tar.gz | sed 's/^/- /' >> README.txt

          git add *.tar.gz README.txt
          git commit -m "Publish executable bundle for ${GITHUB_SHA}"
          git push --force origin exe:exe
