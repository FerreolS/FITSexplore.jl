name: Build Relocatable Exe

on:
  push:
    branches:
      - master
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish executable bundle
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
          arch: x64

      - uses: julia-actions/cache@v3

      - name: Build relocatable bundle
        env:
          JULIAC_ENV: /tmp/juliac-env
          BUNDLE_DIR: build-juliac
          EXE_NAME: fitsexplore
          TRIM_MODE: safe
          EXPERIMENTAL: "1"
        run: julia --color=yes make.jl

      - name: Archive bundle
        run: |
          set -euxo pipefail
          ARCHIVE="fitsexplore-linux-x86_64-${GITHUB_SHA}.tar.gz"
          tar -C "${GITHUB_WORKSPACE}" -czf "/tmp/${ARCHIVE}" build-juliac
          sha256sum "/tmp/${ARCHIVE}" > "/tmp/${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Publish tarball to exe branch
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin exe; then
            git fetch origin exe
            git checkout -B exe origin/exe
          else
            git checkout --orphan exe
            git rm -rf . || true
          fi

          # Keep branch contents focused on distributable artefacts.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp "/tmp/${ARCHIVE}" "./${ARCHIVE}"
          cp "/tmp/${ARCHIVE}.sha256" "./${ARCHIVE}.sha256"

          cat > README.txt <<EOF
          Relocatable FITSexplore executable bundles.

          Source commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          git add "${ARCHIVE}" "${ARCHIVE}.sha256" README.txt
          git commit -m "Update executable bundle for ${GITHUB_SHA}" || true
          git push origin exe
